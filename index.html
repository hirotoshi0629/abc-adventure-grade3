<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ABCアドベンチャー</title>
<style>
@font-face{font-family:NH;src:url("NHHandwriting-Medium.otf") format("opentype");font-display:swap}
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#dff5ff;color:#33291f}
button{font:inherit;touch-action:manipulation}.app{max-width:1180px;margin:auto;min-height:100vh;background:linear-gradient(#9de2ff,#f8efb8 56%,#b9e985);padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:1000;font-size:clamp(28px,5vw,58px);color:#d85a13;text-shadow:0 3px #fff}.stats{display:flex;gap:8px}.pill{background:#fff;border:3px solid #9b642a;border-radius:30px;padding:9px 16px;font-weight:900}
.hero{margin:8px 0 14px;background:linear-gradient(135deg,#78d7ff,#fff0a8);border:4px solid #fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 #9b642a;display:flex;justify-content:space-between;align-items:center;min-height:150px}.hero h1{margin:0;font-size:clamp(22px,4vw,44px)}.hero p{font-weight:800}.world{background:#fff8df;border:3px solid #9b642a;border-radius:18px;padding:12px;text-align:center;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.game{min-height:160px;border:4px solid #fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 rgba(92,61,30,.35);cursor:pointer;text-align:left}.game b{display:block;font-size:clamp(18px,2.1vw,27px);margin-bottom:8px}.game small{font-weight:800;line-height:1.55}.g1{background:#ffe77a}.g2{background:#ffc7e3}.g3{background:#bdeeff}.g4{background:#d8c8ff}.g5{background:#c9f48d}.g6{background:#ffe4a0}.g7{background:#aef0c4}.g8{background:#ffc2a7}
.letter{font-family:NH,sans-serif;font-size:42px;letter-spacing:8px}.nav{margin-top:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:#a96b2c;padding:10px;border-radius:18px}.nav button{border:0;border-radius:13px;padding:12px 5px;background:#fff1c2;font-weight:900;cursor:pointer}
.screen{display:none;background:#fffdf3;border-radius:24px;padding:20px;min-height:70vh}.screen.active{display:block}.home.hidden{display:none}.back{border:0;background:#ffd34f;border-radius:14px;padding:10px 16px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.card{aspect-ratio:1;border:4px solid #69a8d8;border-radius:20px;background:white;font-family:NH,sans-serif;font-size:clamp(42px,9vw,92px);font-weight:700}.message{text-align:center;font-size:24px;font-weight:900;margin:18px}
.player-select{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.player-btn{border:3px solid #9b642a;background:#ffe77a;border-radius:18px;padding:18px 26px;font-size:24px;font-weight:1000}.karuta-note{text-align:center;font-weight:800}.karuta-top,.score-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:12px}.sound-btn{border:0;border-radius:14px;background:#8edcff;padding:10px 16px;font-weight:900}.score-row span{padding:8px 13px;border-radius:14px;font-weight:1000;background:#eee}.p1{background:#bfe2ff!important}.p2{background:#ffc7d1!important}.p3{background:#c8f2b2!important}.p4{background:#fff0a4!important}.karuta-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:820px;margin:14px auto}.karuta-card{aspect-ratio:1.25;background:#fff;border:4px solid #e2b65d;border-radius:18px;font-family:NH,sans-serif;font-size:clamp(46px,8vw,82px);box-shadow:0 5px 0 #b67a31}.karuta-card.hit{background:#fff09a;transform:scale(.96)}.karuta-card.wrong{animation:shake .25s}.claim-row{display:flex;justify-content:center;gap:10px;margin-top:12px}.claim{border:0;border-radius:15px;padding:13px 22px;font-weight:1000}.finish-box{text-align:center;padding:30px;font-size:22px;font-weight:900}.big-star{font-size:80px;color:#f5b400}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.memory-head{text-align:center}.memory-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:18px auto}.memory-card{position:relative;aspect-ratio:.82;border:4px solid #b876c8;border-radius:18px;background:#8752a0;box-shadow:0 5px 0 #60396f;font-family:NH,sans-serif;font-size:clamp(42px,7vw,72px);font-weight:700;overflow:hidden}.memory-card .memory-front{display:none}.memory-card .memory-back{display:block;color:#fff;font-family:inherit}.memory-card.open,.memory-card.matched{background:#fff9d6;border-color:#e3ad45;transform:translateY(3px);box-shadow:0 2px 0 #a8752e}.memory-card.open .memory-front,.memory-card.matched .memory-front{display:block}.memory-card.open .memory-back,.memory-card.matched .memory-back{display:none}.memory-card.matched{background:#d8f5b4}.memory-celebrate{font-family:NH,sans-serif;font-size:64px;letter-spacing:15px;color:#8752a0}
.listen-setup{text-align:center;max-width:760px;margin:auto}.choice-row,.level-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.mode-btn,.level-btn{border:4px solid #9bc5dc;background:#fff;border-radius:18px;padding:14px 24px;font-weight:1000;min-width:130px}.mode-btn.selected,.level-btn.selected{background:#bdeeff;border-color:#3b91c4;transform:translateY(-2px)}.level-btn small{font-weight:700}.start-btn{margin:26px auto;border:0;border-radius:22px;background:#ffcf3f;box-shadow:0 5px 0 #b77a21;padding:16px 42px;font-size:26px;font-weight:1000}.listen-status{display:flex;justify-content:center;gap:30px;font-size:20px;font-weight:900}.listen-cards{display:grid;gap:14px;max-width:820px;margin:16px auto}.listen-cards.four{grid-template-columns:repeat(4,1fr)}.listen-cards.six{grid-template-columns:repeat(3,1fr)}.listen-card{aspect-ratio:1;background:#fff;border:4px solid #58acd0;border-radius:22px;font-family:NH,sans-serif;font-size:clamp(54px,9vw,96px);box-shadow:0 6px 0 #367fa1}.listen-card.correct{background:#d9f6ad;border-color:#72b83e;transform:translateY(4px);box-shadow:0 2px 0 #4d8d2c}.listen-card.listen-wrong{animation:shake .25s;background:#ffe0df}.listen-result{font-family:NH,sans-serif;font-size:72px;color:#3189b3;font-weight:900}
.rocket-game{display:grid;grid-template-columns:minmax(260px,.85fr) 1.15fr;gap:18px}.rocket-sky{position:relative;min-height:520px;overflow:hidden;border-radius:25px;background:linear-gradient(#172a69 0%,#477fc4 38%,#9cddf4 68%,#e7f7ff 100%);border:4px solid #fff;box-shadow:0 5px 0 #6686a0}.rocket-stars{position:absolute;top:20px;width:100%;text-align:center;color:#fff7b0;font-family:NH,sans-serif;font-size:20px;letter-spacing:10px}.rocket-orbit{position:absolute;right:16px;top:70px;width:115px;height:115px;border-radius:50%;background:#ffe48a;border:7px solid #f6bc52;display:grid;place-items:center;text-align:center;font-family:NH,sans-serif;font-weight:900;color:#8b5a2b}.rocket-craft{position:absolute;left:50%;transform:translateX(-50%);width:78px;height:135px;background:#fff7e5;border:5px solid #536d86;border-radius:50% 50% 22% 22%;transition:bottom .6s ease;z-index:3}.rocket-craft:before,.rocket-craft:after{content:"";position:absolute;bottom:14px;width:30px;height:52px;background:#e85b4d;border:4px solid #7d3c38}.rocket-craft:before{left:-27px;border-radius:50% 10% 10% 50%}.rocket-craft:after{right:-27px;border-radius:10% 50% 50% 10%}.rocket-window{position:absolute;width:32px;height:32px;border-radius:50%;background:#8dddf1;border:5px solid #536d86;left:18px;top:34px}.rocket-flame{position:absolute;left:22px;bottom:-38px;width:25px;height:38px;background:#ffd14d;border-radius:10% 10% 60% 60%;animation:flame .22s infinite alternate}.rocket-ground{position:absolute;bottom:0;width:100%;height:8%;background:#7ebc5b}.rocket-cloud{position:absolute;width:90px;height:30px;border-radius:30px;background:rgba(255,255,255,.8)}.rocket-cloud:before,.rocket-cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.rocket-cloud:before{width:42px;height:42px;left:15px;top:-20px}.rocket-cloud:after{width:50px;height:50px;right:8px;top:-27px}.c1{left:8%;bottom:30%}.c2{right:8%;bottom:52%}.rocket-panel{align-self:center}.rocket-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:520px;margin:auto}.rocket-letter{aspect-ratio:1.7;border:4px solid #5a8fc2;border-radius:20px;background:#fff;font-family:NH,sans-serif;font-size:64px;box-shadow:0 5px 0 #416b91}.rocket-letter.correct{background:#d9f6ad;transform:translateY(4px);box-shadow:0 1px 0 #416b91}.rocket-letter.listen-wrong{animation:shake .25s;background:#ffe0df}.planet-big{margin:auto;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:#ffe58e;border:10px solid #efb74c;font-family:NH,sans-serif;font-size:50px;color:#825a25}.rocket-finish{background:linear-gradient(#d8edff,#fff6c5);border-radius:25px}@keyframes flame{from{height:28px;opacity:.8}to{height:42px;opacity:1}}
.monster-wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.battle-stage{position:relative;min-height:520px;border-radius:25px;padding:18px;background:linear-gradient(#624b9a,#8d78bd 48%,#c6b4dc);border:4px solid #fff;box-shadow:0 5px 0 #5a4678;color:#fff}.battle-top,.hero-status{display:flex;justify-content:space-between;gap:10px;font-weight:1000}.monster-name{text-align:center;margin-top:28px;font-weight:1000;letter-spacing:2px}.monster-body{position:relative;width:210px;height:220px;margin:24px auto 16px;border:6px solid #5b425f;border-radius:48% 48% 40% 40%;background:#9fdb73;box-shadow:inset 0 -18px rgba(0,0,0,.08)}.mtype2{background:#79cce1}.mtype3{background:#f0a274}.mtype4{background:#d695d2}.monster-horns:before,.monster-horns:after{content:"";position:absolute;top:-35px;width:42px;height:65px;background:#f8e6a0;border:5px solid #5b425f}.monster-horns:before{left:24px;transform:rotate(-25deg);border-radius:80% 10%}.monster-horns:after{right:24px;transform:rotate(25deg);border-radius:10% 80%}.monster-eyes{display:flex;justify-content:center;gap:35px;margin-top:52px}.monster-eyes i{width:30px;height:36px;background:#fff;border:5px solid #4b3a50;border-radius:50%;position:relative}.monster-eyes i:after{content:"";position:absolute;width:9px;height:12px;background:#33283a;border-radius:50%;left:7px;top:8px}.monster-mouth{width:75px;height:35px;border:6px solid #5b425f;border-top:0;border-radius:0 0 50px 50px;margin:25px auto 0}.monster-mark{position:absolute;right:14px;bottom:10px;font-family:NH,sans-serif;font-size:38px;font-weight:900;color:#5b425f}.monster-hp{font-weight:900}.hpbar{height:18px;background:#fff;border-radius:20px;overflow:hidden;margin-top:5px}.hpbar i{display:block;height:100%;background:#ffd04e;transition:.4s}.hero-status{margin-top:18px;background:rgba(255,255,255,.2);padding:10px;border-radius:12px}.battle-panel{align-self:center}.monster-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:520px;margin:auto}.monster-letter{aspect-ratio:1.6;border:4px solid #7c62a5;border-radius:20px;background:#fff;font-family:NH,sans-serif;font-size:64px;box-shadow:0 5px 0 #584575}.monster-letter.correct{background:#d9f6ad;transform:translateY(4px);box-shadow:0 1px 0 #584575}.monster-letter.listen-wrong{animation:shake .25s;background:#ffe0df}.special-hit{animation:special .18s 4}.monster-medal{width:150px;height:150px;border-radius:50%;margin:auto;display:grid;place-items:center;background:#ffe275;border:10px double #c48b23;font-family:NH,sans-serif;font-size:45px;font-weight:900}.monster-clear{background:linear-gradient(#e5dcff,#fff5bd);border-radius:24px}@keyframes special{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.8);transform:scale(.94)}}
@media(max-width:800px){.monster-wrap{grid-template-columns:1fr}.battle-stage{min-height:410px}.monster-body{transform:scale(.75);margin:-2px auto -8px}.rocket-game{grid-template-columns:1fr}.rocket-sky{min-height:300px}.rocket-craft{transform:translateX(-50%) scale(.75)}.rocket-orbit{width:85px;height:85px;font-size:11px}.listen-cards.four{grid-template-columns:repeat(2,1fr)}.listen-cards.six{grid-template-columns:repeat(3,1fr)}.memory-board{grid-template-columns:repeat(3,1fr);gap:9px}}.grid{grid-template-columns:repeat(2,1fr)}.nav{grid-template-columns:repeat(3,1fr)}.game{min-height:135px}.hero{align-items:flex-start}.world{font-size:12px}}
</style></head><body><main class="app">
<div id="home" class="home">
<header><div class="logo">ABC アドベンチャー</div><div class="stats"><div class="pill">★ <span id="stars">0</span></div><div class="pill">COIN <span id="coins">0</span></div></div></header>
<section class="hero"><div><h1>26文字の たからものを さがそう！</h1><p>きいて・みつけて・あつめて、ABCワールドを大きくしよう。</p><div class="letter">A B C D E F</div></div><div class="world">MY WORLD<br>草原エリア Lv.<span id="worldLv">1</span></div></section>
<section class="grid">
<button class="game g1" onclick="openGame('karuta')"><b>ABCかるた</b><small>音を聞いて文字をタッチ！</small></button>
<button class="game g2" onclick="openGame('memory')"><b>ABC神経衰弱</b><small>1〜3人でカードをそろえよう！</small></button>
<button class="game g3" onclick="openGame('listen')"><b>聞いてタッチ！</b><small>4枚・6枚、3つのレベルで挑戦！</small></button>
<button class="game g4" onclick="openGame('rocket')"><b>ABCロケット</b><small>正しい文字を選んで宇宙へ！</small></button>
<button class="game g5" onclick="openGame('monster')"><b>アルファベットモンスター</b><small>聞こえた文字のモンスターを倒そう！</small></button>
<button class="game g6" onclick="openGame('treasure')"><b>ABCトレジャーハント</b><small>かくれた文字を見つけよう！</small></button>
<button class="game g7" onclick="openGame('train')"><b>ABCトレイン</b><small>たりない文字を選んで列車を完成！</small></button>
<button class="game g8" onclick="openGame('boss')"><b>ボスバトル</b><small>いろいろな問題でボスに挑戦！</small></button>
</section>
<nav class="nav"><button onclick="showNotice('ぼうけんマップ')">ぼうけんマップ</button><button onclick="showNotice('ABCずかん')">ABCずかん</button><button onclick="showNotice('たまご・なかま')">たまご・なかま</button><button onclick="showNotice('ごほうびマシン')">ごほうびマシン</button><button onclick="showNotice('しょうごう')">しょうごう</button><button onclick="showNotice('せってい')">せってい</button></nav>
</div>
<section id="game" class="screen"><button class="back" onclick="goHome()">← ホーム</button><h2 id="gameTitle"></h2><div id="gameBody"></div></section>
</main>
<script>
const ABC="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");let save=JSON.parse(localStorage.getItem("abcAdventureSave")||'{"stars":0,"coins":0,"worldLv":1}');
function render(){stars.textContent=save.stars;coins.textContent=save.coins;worldLv.textContent=save.worldLv}
function persist(){localStorage.setItem("abcAdventureSave",JSON.stringify(save));render()}
const titles={karuta:"ABCかるた",memory:"ABC神経衰弱",listen:"聞いてタッチ！",rocket:"ABCロケット",monster:"アルファベットモンスター",treasure:"ABCトレジャーハント",train:"ABCトレイン",boss:"ボスバトル"};
function openGame(id){home.classList.add("hidden");game.classList.add("active");gameTitle.textContent=titles[id]; if(id==="karuta") startKarutaSetup(); else if(id==="memory") startMemorySetup(); else if(id==="listen") startListen(); else if(id==="rocket") startRocket(); else if(id==="monster") startMonster(); else gameBody.innerHTML='<div class="message">このゲームのステージを準備中！<br>ここから順番に遊べるようになります。</div>'}
function goHome(){game.classList.remove("active");home.classList.remove("hidden")}
function sayLetter(l){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(l);u.lang="en-US";u.rate=.75;speechSynthesis.speak(u)}
function sample(n){return [...ABC].sort(()=>Math.random()-.5).slice(0,n)}
let target="";
let listen={count:4,level:"normal",round:0,correct:0,maxRounds:10,target:""};
const similarGroups=[["B","D","P","T"],["C","G","O","Q"],["E","F","L","I"],["M","N","W","V"],["A","H","K","R"],["S","X","Z","Y"]];
function startListen(){
 gameBody.innerHTML='<div class="listen-setup"><div class="message">カードの まいすう</div><div class="choice-row"><button class="mode-btn selected" id="c4" onclick="setListenCount(4)">4まい</button><button class="mode-btn" id="c6" onclick="setListenCount(6)">6まい</button></div><div class="message">レベルを えらぼう</div><div class="level-row"><button class="level-btn selected" id="lnormal" onclick="setListenLevel(\'normal\')">ふつう<br><small>いろいろな文字</small></button><button class="level-btn" id="lfast" onclick="setListenLevel(\'fast\')">スピード<br><small>テンポよく10問</small></button><button class="level-btn" id="lsimilar" onclick="setListenLevel(\'similar\')">そっくり<br><small>にた文字に挑戦</small></button></div><button class="start-btn" onclick="beginListen()">スタート！</button></div>';
}
function setListenCount(n){listen.count=n;document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("selected"));document.getElementById("c"+n).classList.add("selected")}
function setListenLevel(v){listen.level=v;document.querySelectorAll(".level-btn").forEach(b=>b.classList.remove("selected"));document.getElementById("l"+v).classList.add("selected")}
function beginListen(){listen.round=0;listen.correct=0;nextListen()}
function nextListen(){
 listen.round++;
 if(listen.round>listen.maxRounds){finishListen();return}
 let a;
 if(listen.level==="similar"){
   let group=similarGroups[Math.floor(Math.random()*similarGroups.length)];
   a=[...group];
   while(a.length<listen.count){let x=ABC[Math.floor(Math.random()*ABC.length)];if(!a.includes(x))a.push(x)}
   a=a.sort(()=>Math.random()-.5).slice(0,listen.count);
 }else a=sample(listen.count);
 listen.target=a[Math.floor(Math.random()*a.length)];
 gameBody.innerHTML='<div class="listen-status"><b>'+listen.round+' / '+listen.maxRounds+'</b><span>せいかい '+listen.correct+'</span></div><div class="message">よく聞いて、文字をタッチ！ <button class="sound-btn" onclick="sayLetter(listen.target)">もう一度聞く</button></div><div class="listen-cards '+(listen.count===6?'six':'four')+'">'+a.map(x=>'<button class="listen-card" onclick="answerListen(\\''+x+'\\',this)">'+x+'</button>').join("")+'</div><div id="listenMsg" class="message"></div>';
 setTimeout(()=>sayLetter(listen.target),listen.level==="fast"?180:400);
}
function answerListen(x,el){
 if(document.querySelector(".listen-card.correct"))return;
 if(x===listen.target){
   el.classList.add("correct");listen.correct++;save.stars++;save.coins+=listen.level==="similar"?4:3;persist();
   document.getElementById("listenMsg").textContent="せいかい！";
   setTimeout(nextListen,listen.level==="fast"?450:750);
 }else{
   el.classList.add("listen-wrong");document.getElementById("listenMsg").textContent="もう一度 よく聞こう！";
   setTimeout(()=>el.classList.remove("listen-wrong"),400);sayLetter(listen.target);
 }
}
function finishListen(){
 let bonus=listen.correct===10?10:0;if(bonus){save.coins+=bonus;persist()}
 gameBody.innerHTML='<div class="finish-box"><h2>10もん おわり！</h2><div class="listen-result">'+listen.correct+' / 10</div><p>'+(listen.correct===10?'ぜんもん せいかい！ ボーナスコイン +10！':listen.correct>=8?'すごい！ よく聞き分けたね！':'何回でも ちょうせんできるよ！')+'</p><button class="back" onclick="beginListen()">同じレベルでもう一回</button> <button class="back" onclick="startListen()">モードをかえる</button></div>';
}
let karuta={players:1,round:0,maxRounds:10,scores:[0,0,0,0],target:"",locked:false};
function startKarutaSetup(){
 gameBody.innerHTML='<div class="message">なん人で あそぶ？</div><div class="player-select">'+[1,2,3,4].map(n=>'<button class="player-btn" onclick="beginKaruta('+n+')">'+n+'人</button>').join("")+'</div><p class="karuta-note">iPadを まんなかに おいて、聞こえた文字を いちばん早くタッチ！</p>';
}
function beginKaruta(n){karuta={players:n,round:0,maxRounds:10,scores:[0,0,0,0],target:"",locked:false};nextKaruta()}
function nextKaruta(){
 karuta.round++; karuta.locked=false;
 if(karuta.round>karuta.maxRounds){finishKaruta();return}
 let letters=sample(12);karuta.target=letters[Math.floor(Math.random()*letters.length)];
 gameBody.innerHTML='<div class="karuta-top"><b>'+karuta.round+' / '+karuta.maxRounds+'</b><button class="sound-btn" onclick="sayLetter(karuta.target)">もう一度聞く</button></div><div class="score-row">'+Array.from({length:karuta.players},(_,i)=>'<span class="p'+(i+1)+'">'+(i+1)+'P '+karuta.scores[i]+'枚</span>').join("")+'</div><div class="karuta-board">'+letters.map(x=>'<button class="karuta-card" onclick="takeKaruta(\''+x+'\',this)">'+x+'</button>').join("")+'</div><div id="karutaMsg" class="message">よく聞いてね！</div>';
 setTimeout(()=>sayLetter(karuta.target),450);
}
function takeKaruta(x,el){
 if(karuta.locked)return;
 if(x!==karuta.target){el.classList.add("wrong");setTimeout(()=>el.classList.remove("wrong"),350);sayLetter(karuta.target);return}
 karuta.locked=true;el.classList.add("hit");
 if(karuta.players===1){karuta.scores[0]++;save.stars++;save.coins+=2;persist();setTimeout(nextKaruta,750);return}
 document.getElementById("karutaMsg").innerHTML='だれが とった？<div class="claim-row">'+Array.from({length:karuta.players},(_,i)=>'<button class="claim p'+(i+1)+'" onclick="claimKaruta('+i+')">'+(i+1)+'P</button>').join("")+'</div>';
}
function claimKaruta(i){karuta.scores[i]++;save.stars++;save.coins+=2;persist();setTimeout(nextKaruta,350)}
function finishKaruta(){
 let best=Math.max(...karuta.scores.slice(0,karuta.players));let winners=[];for(let i=0;i<karuta.players;i++)if(karuta.scores[i]===best)winners.push((i+1)+'P');
 gameBody.innerHTML='<div class="finish-box"><h2>かるた おわり！</h2><div class="big-star">★</div><p>'+winners.join("・")+'　'+best+'枚！</p><p>スターとコインをゲットしたよ！</p><button class="back" onclick="beginKaruta('+karuta.players+')">もう一回</button> <button class="back" onclick="startKarutaSetup()">人数をかえる</button></div>';
}
let memory={players:1,current:0,scores:[0,0,0],first:null,second:null,lock:false,matched:0,totalPairs:6};
function startMemorySetup(){
 gameBody.innerHTML='<div class="message">なん人で あそぶ？</div><div class="player-select">'+[1,2,3].map(n=>'<button class="player-btn" onclick="beginMemory('+n+')">'+n+'人</button>').join("")+'</div><p class="karuta-note">同じアルファベットを2まい見つけよう。カードをめくると音も聞こえるよ！</p>';
}
function beginMemory(n){
 memory={players:n,current:0,scores:[0,0,0],first:null,second:null,lock:false,matched:0,totalPairs:6};
 let letters=sample(memory.totalPairs),deck=[...letters,...letters].sort(()=>Math.random()-.5);
 gameBody.innerHTML='<div class="memory-head"><div id="memoryTurn"></div><div id="memoryScores" class="score-row"></div></div><div class="memory-board">'+deck.map((x,i)=>'<button class="memory-card" data-letter="'+x+'" data-index="'+i+'" onclick="flipMemory(this)"><span class="memory-back">?</span><span class="memory-front">'+x+'</span></button>').join("")+'</div><div id="memoryMsg" class="message">カードを2まい めくろう！</div>';
 renderMemoryStatus();
}
function renderMemoryStatus(){
 let t=document.getElementById("memoryTurn"),s=document.getElementById("memoryScores"); if(!t||!s)return;
 t.innerHTML=memory.players===1?'<b>ひとりでチャレンジ</b>':'<b class="p'+(memory.current+1)+'">'+(memory.current+1)+'P のばん</b>';
 s.innerHTML=Array.from({length:memory.players},(_,i)=>'<span class="p'+(i+1)+'">'+(i+1)+'P '+memory.scores[i]+'ペア</span>').join("");
}
function flipMemory(card){
 if(memory.lock||card.classList.contains("open")||card.classList.contains("matched"))return;
 card.classList.add("open");sayLetter(card.dataset.letter);
 if(!memory.first){memory.first=card;return}
 memory.second=card;memory.lock=true;
 if(memory.first.dataset.letter===memory.second.dataset.letter){
   memory.first.classList.add("matched");memory.second.classList.add("matched");memory.scores[memory.current]++;memory.matched++;
   save.stars+=2;save.coins+=3;persist();
   memory.first=null;memory.second=null;memory.lock=false;renderMemoryStatus();
   document.getElementById("memoryMsg").textContent="そろった！ もう一回できるよ！";
   if(memory.matched===memory.totalPairs)setTimeout(finishMemory,650);
 }else{
   document.getElementById("memoryMsg").textContent="おしい！ つぎの人へ。";
   setTimeout(()=>{memory.first.classList.remove("open");memory.second.classList.remove("open");memory.first=null;memory.second=null;if(memory.players>1)memory.current=(memory.current+1)%memory.players;memory.lock=false;renderMemoryStatus();document.getElementById("memoryMsg").textContent="カードを2まい めくろう！";},900);
 }
}
function finishMemory(){
 let active=memory.scores.slice(0,memory.players),best=Math.max(...active),w=[];active.forEach((v,i)=>{if(v===best)w.push((i+1)+"P")});
 gameBody.innerHTML='<div class="finish-box"><h2>ぜんぶ そろった！</h2><div class="memory-celebrate">A B C</div><p>'+(memory.players===1?'6ペア クリア！':w.join("・")+'　'+best+'ペア！')+'</p><p>スターとコインをゲット！</p><button class="back" onclick="beginMemory('+memory.players+')">もう一回</button> <button class="back" onclick="startMemorySetup()">人数をかえる</button></div>';
}
let rocket={round:0,correct:0,target:"",maxRounds:8};
function startRocket(){rocket={round:0,correct:0,target:"",maxRounds:8};nextRocket()}
function nextRocket(){
 rocket.round++;
 if(rocket.round>rocket.maxRounds){finishRocket();return}
 let choices=sample(4);rocket.target=choices[Math.floor(Math.random()*choices.length)];
 let height=Math.min(88,(rocket.correct/rocket.maxRounds)*82+4);
 gameBody.innerHTML='<div class="rocket-game"><div class="rocket-sky"><div class="rocket-stars">A　B　C　D　E　F</div><div class="rocket-orbit">ABC PLANET</div><div class="rocket-craft" style="bottom:'+height+'%"><span class="rocket-window"></span><span class="rocket-flame"></span></div><div class="rocket-cloud c1"></div><div class="rocket-cloud c2"></div><div class="rocket-ground"></div></div><div class="rocket-panel"><div class="listen-status"><b>'+rocket.round+' / '+rocket.maxRounds+'</b><span>パワー '+rocket.correct+'</span></div><div class="message">聞こえた文字をえらんで、ロケットにパワーをためよう！ <button class="sound-btn" onclick="sayLetter(rocket.target)">もう一度聞く</button></div><div class="rocket-choices">'+choices.map(x=>'<button class="rocket-letter" onclick="answerRocket(\\''+x+'\\',this)">'+x+'</button>').join("")+'</div><div id="rocketMsg" class="message"></div></div></div>';
 setTimeout(()=>sayLetter(rocket.target),400);
}
function answerRocket(x,el){
 if(document.querySelector(".rocket-letter.correct"))return;
 if(x===rocket.target){
   el.classList.add("correct");rocket.correct++;save.stars+=2;save.coins+=3;persist();
   document.getElementById("rocketMsg").textContent=rocket.correct===rocket.maxRounds?"フルパワー！":"パワーアップ！";
   setTimeout(nextRocket,700);
 }else{
   el.classList.add("listen-wrong");document.getElementById("rocketMsg").textContent="もう一度 音を聞いてみよう！";
   setTimeout(()=>el.classList.remove("listen-wrong"),400);sayLetter(rocket.target);
 }
}
function finishRocket(){
 save.coins+=12;save.worldLv=Math.max(save.worldLv,2);persist();
 gameBody.innerHTML='<div class="finish-box rocket-finish"><div class="planet-big">ABC</div><h2>ABC PLANETに とうちゃく！</h2><p>8もんクリア！ ボーナスコイン +12</p><p>ABCワールドに 新しい道がひらいたよ。</p><button class="back" onclick="startRocket()">もう一回 とぶ！</button></div>';
}
let monster={round:0,maxRounds:8,target:"",hp:5,combo:0,bestCombo:0,power:0,locked:false};
function startMonster(){
 monster={round:0,maxRounds:8,target:"",hp:5,combo:0,bestCombo:0,power:0,locked:false};
 nextMonster();
}
function nextMonster(){
 monster.round++;
 if(monster.round>monster.maxRounds){finishMonster();return}
 monster.locked=false;
 let choices=sample(4);monster.target=choices[Math.floor(Math.random()*choices.length)];
 let faces=["M","G","R","Z"],face=faces[(monster.round-1)%faces.length];
 gameBody.innerHTML='<div class="monster-wrap"><div class="battle-stage"><div class="battle-top"><span>STAGE '+monster.round+' / '+monster.maxRounds+'</span><span>れんぞく '+monster.combo+'</span></div><div class="monster-name">LETTER MONSTER</div><div class="monster-body mtype'+((monster.round-1)%4+1)+'"><div class="monster-horns"></div><div class="monster-eyes"><i></i><i></i></div><div class="monster-mouth"></div><div class="monster-mark">'+face+'</div></div><div class="monster-hp"><span>MONSTER HP</span><div class="hpbar"><i style="width:'+Math.max(10,100-(monster.round-1)*12)+'%"></i></div></div><div class="hero-status"><span>あなたのHP '+Array.from({length:5},(_,i)=>i<monster.hp?"●":"○").join(" ")+'</span><span>ひっさつパワー '+monster.power+'/3</span></div></div><div class="battle-panel"><div class="message">モンスターが さけんだ文字はどれ？ <button class="sound-btn" onclick="sayLetter(monster.target)">もう一度聞く</button></div><div class="monster-choices">'+choices.map(x=>'<button class="monster-letter" onclick="answerMonster(\\''+x+'\\',this)">'+x+'</button>').join("")+'</div><div id="monsterMsg" class="message">3れんぞく正解で ひっさつわざ！</div></div></div>';
 setTimeout(()=>sayLetter(monster.target),450);
}
function answerMonster(x,el){
 if(monster.locked)return;
 if(x===monster.target){
   monster.locked=true;monster.combo++;monster.bestCombo=Math.max(monster.bestCombo,monster.combo);monster.power++;
   el.classList.add("correct");save.stars+=2;save.coins+=3;
   let msg="ヒット！";
   if(monster.power>=3){monster.power=0;save.stars+=3;save.coins+=5;msg="ABC スーパービーム！ ボーナス！";document.querySelector(".monster-body").classList.add("special-hit")}
   persist();document.getElementById("monsterMsg").textContent=msg;setTimeout(nextMonster,850);
 }else{
   monster.hp=Math.max(0,monster.hp-1);monster.combo=0;monster.power=0;el.classList.add("listen-wrong");
   document.getElementById("monsterMsg").textContent="おしい！ 音をもう一度聞こう。";
   if(monster.hp===0){monster.locked=true;setTimeout(monsterRecover,700)}else{setTimeout(()=>el.classList.remove("listen-wrong"),400);sayLetter(monster.target)}
 }
}
function monsterRecover(){
 gameBody.innerHTML='<div class="finish-box"><h2>パワーを かいふくしよう！</h2><p>だいじょうぶ。何回でも ちょうせんできるよ。</p><button class="back" onclick="startMonster()">もう一回 ちょうせん</button></div>';
}
function finishMonster(){
 save.coins+=15;save.worldLv=Math.max(save.worldLv,3);persist();
 gameBody.innerHTML='<div class="finish-box monster-clear"><div class="monster-medal">ABC</div><h2>モンスターに かった！</h2><p>さいこう '+monster.bestCombo+'れんぞく正解！</p><p>クリアボーナス コイン +15</p><p>ABCワールドに 新しいエリアがひらいたよ。</p><button class="back" onclick="startMonster()">もう一回 バトル</button></div>';
}
function showNotice(x){alert(x+"は、ゲームの進みとつながる長期コレクション機能として実装します。")}
render();
</script></body></html>
