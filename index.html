/* unified ABC Adventure game art direction */
#game{background:
linear-gradient(rgba(255,253,239,.91),rgba(255,253,239,.96)),
radial-gradient(circle at 12% 12%,#8edcff 0 12%,transparent 13%),
radial-gradient(circle at 88% 18%,#ffe27a 0 8%,transparent 9%),
linear-gradient(160deg,#9ddfff 0 42%,#a8d978 43% 61%,#72cbe0 62% 100%)}
#game .topbar{background:linear-gradient(#d99a4b,#a6602c);border:5px solid #75421f;border-radius:18px;padding:10px 14px;box-shadow:inset 0 0 0 3px rgba(255,232,179,.4),0 4px 0 rgba(91,55,29,.25)}
#gameTitle{color:#fff8dd;text-shadow:0 2px 0 #74401f}
#gameBody>.message,#gameBody .message{background:#fff9dc;border:4px solid #c99450;border-radius:18px;padding:12px;box-shadow:0 3px 0 rgba(112,78,39,.18)}
.karuta-board,.cards,.listen-choices,.rocket-choices,.monster-choices,.treasure-letters{background:rgba(255,255,255,.48);border:4px solid rgba(157,108,55,.38);border-radius:24px;padding:14px}
.karuta-card,.memory-card,.listen-letter,.rocket-letter,.monster-letter,.treasure-letter{border-color:#9d7040!important;box-shadow:0 5px 0 #805a35!important;background:linear-gradient(#fffef5,#fff1bd)!important}
.karuta-card:active,.memory-card:active,.listen-letter:active,.rocket-letter:active,.monster-letter:active,.treasure-letter:active{transform:translateY(4px);box-shadow:0 1px 0 #805a35!important}
.listen-status,.score-row{background:#fff4c8!important;border:3px solid #c18c48!important;border-radius:16px!important;padding:10px!important}
.finish-box{border:6px solid #fff!important;box-shadow:0 7px 0 rgba(105,74,38,.28)!important}
.finish-box h2{font-size:clamp(28px,5vw,46px);color:#70411f;text-shadow:0 2px #fff}
.sound-btn{min-height:48px;border:3px solid #2d78a9!important;border-radius:16px!important;background:#d9f3ff!important;font-weight:1000!important}
.train-panel,.boss-panel{background:rgba(255,250,224,.9);border:5px solid #fff;border-radius:24px;padding:16px;box-shadow:0 5px 0 rgba(94,67,41,.2)}
.treasure-map,.train-sky,.boss-stage{box-shadow:inset 0 0 0 5px rgba(255,255,255,.3),0 7px 0 rgba(91,65,40,.25)!important}
@media(max-width:520px){.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(2,1fr)}.game{min-height:120px}.hero{display:grid;grid-template-columns:1fr}.world{margin-top:8px}.cards,.karuta-board{grid-template-columns:repeat(3,1fr)}}
.karuta-card,.memory-card,.listen-letter,.rocket-letter,.monster-letter,.treasure-letter,.train-letter,.boss-letter{font-family:"NHHandwriting","Arial Rounded MT Bold","Trebuchet MS",sans-serif;min-height:64px}

/* FINAL MASTER CONTRACT
   The user-approved home reference is authoritative. Do not redesign it.
   Bottom navigation is exactly 7 items. Daily mission stays on Home, not bottom nav.
   Generated art may only be isolated text-free assets matching the approved watercolor + colored-pencil world.
   Do not bake Japanese UI text, counters, buttons, or layouts into generated art.
*/
/* DO NOT GENERATE SCREEN MONTAGES OR ALTERNATE HOME DESIGNS.
   Visual assets must be isolated, text-free illustrations only, matching the approved user-supplied master.
   UI text, buttons, counters and layout stay HTML/CSS and must not be baked into generated images. */

/* MASTER HOME DESIGN LOCK
   Approved reference: user-supplied ABC Adventure home screen.
   Keep: 8 game cards in 4x2 order; 7 bottom nav items; wood/watercolor/pencil visual language;
   castle/rainbow/waterfall/harbor world; boy+girl+dog; My World panel at upper right.
   Daily mission is NOT a bottom-nav item. Do not redesign the home structure. */

/* MASTER INNER-SCREEN VISUAL SYSTEM
   Keeps the approved home composition intact; applies its wood + watercolor/pencil language to inner screens. */
:root{--wood:#8b5a2b;--wood-dark:#65401f;--paper:#fff9df;--ink:#3c2d20;--sky:#a9e4f6;--grass:#a9d875;--gold:#f4c85a}
#game{background:linear-gradient(180deg,#a9e5f7 0,#eaf7e5 46%,#f8edbd 100%);min-height:100vh}
#game .game-topbar{background:linear-gradient(#a56b32,#805022);border-bottom:5px solid #613b1d;color:#fff;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));box-shadow:0 4px 0 rgba(74,44,20,.22)}
#game .game-topbar h2{margin:0;text-shadow:0 2px rgba(75,43,19,.5)}
#game .game-body{max-width:1180px;margin:auto;padding:16px}
.message,.karuta-note,.listen-status,.memory-head{color:var(--ink)}
.sound-btn,.back,.mode-btn,.level-btn,.start-btn,.player-btn,.claim{border:3px solid var(--wood-dark);background:linear-gradient(#fff7ce,#f2cf76);color:var(--ink);box-shadow:0 4px 0 var(--wood-dark);font-weight:900}
.sound-btn:active,.back:active,.mode-btn:active,.level-btn:active,.start-btn:active,.player-btn:active,.claim:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.rocket-panel,.battle-panel,.treasure-panel,.train-panel,.boss-panel,.listen-setup,.memory-head,.karuta-top{background:rgba(255,249,223,.96);border:4px solid var(--wood);border-radius:22px;padding:16px;box-shadow:0 6px 0 rgba(101,64,31,.2)}
.rocket-letter,.monster-letter,.train-letter,.boss-letter,.listen-card,.karuta-card{background:linear-gradient(#fffdf1,#fff4c9);color:var(--ink);border-color:#b77a35;box-shadow:0 5px 0 #815325}
.rocket-letter.correct,.monster-letter.correct,.train-letter.correct,.boss-letter.correct,.listen-card.correct,.karuta-card.hit{background:#e4f4b9;border-color:#719d45}
.memory-card{border-color:#9566a7;background:linear-gradient(#9463a8,#744783);box-shadow:0 5px 0 #583563}
.memory-card.open,.memory-card.matched{background:linear-gradient(#fffdf1,#fff2bd);border-color:#b77a35}
.finish-box{max-width:820px;margin:18px auto;background:rgba(255,249,223,.97);border:5px solid var(--wood);border-radius:28px;box-shadow:0 8px 0 rgba(101,64,31,.22)}
.book-top,.buddy-top,.myworld-head,.title-head,.daily-banner,.settings-group,.reward-info,.adventure-intro{background:rgba(255,249,223,.97)!important;border-color:var(--wood)!important}
@media(max-width:800px){#game .game-body{padding:10px}.rocket-panel,.battle-panel,.treasure-panel,.train-panel,.boss-panel,.listen-setup,.memory-head,.karuta-top{padding:11px;border-width:3px}}

.play-escape{max-width:1180px;margin:0 auto 6px;text-align:left}
.play-escape button{min-height:40px;padding:6px 12px;border:2px solid #805022;border-radius:12px;background:#fff7d8;color:#49311d;font-weight:900;box-shadow:0 2px 0 #805022}
#game{-webkit-user-select:none;user-select:none}
#game input,#game textarea{-webkit-user-select:text;user-select:text}

 try{

function ensureTitleSave(){if(!save.selectedTitle)save.selectedTitle="";persist()}
function titleUnlocked(d){try{return !!d[2](save)}catch(e){return false}}
function syncEarnedTitles(){save.earnedTitles=save.earnedTitles||[];titleDefs.forEach((d,i)=>{try{if(d[2](save)&&!save.earnedTitles.includes(i))save.earnedTitles.push(i)}catch(e){}})}
function openTitles(){enterGameScreen("しょうごう");syncEarnedTitles();try{localStorage.setItem("abcAdventureSave",JSON.stringify(save))}catch(e){}
 ensureTitleSave();
 let count=titleDefs.filter(titleUnlocked).length;
 gameBody.innerHTML='<div class="title-head"><div><b>見つけたしょうごう　'+count+' / '+titleDefs.length+'</b><small>遊び方によって、ひみつのしょうごうも見つかるよ。</small></div><div class="wearing-title">いまのしょうごう：<b>'+(save.selectedTitle||"まだ つけていない")+'</b></div></div><div class="title-grid">'+titleDefs.map((d,i)=>renderTitle(d,i)).join("")+'</div><div class="secret-title-note">条件が書いていない「？？？」もあるよ。いろいろな遊び方を試してみよう。</div>';
 render();
}
function renderTitle(d,i){
 let u=titleUnlocked(d),secret=d[3],name=u&&secret?secretTitleName(i):d[0],desc=u? (secret?"ひみつの条件を見つけた！":d[1]) : (secret?"条件も名前も ひみつ":d[1]);
 return '<button class="title-card '+(u?'title-open':'title-locked')+' '+(save.selectedTitle===name?'title-selected':'')+'" '+(u?'onclick="selectTitle('+i+')"':'')+'><div class="title-medal">'+(u?titleMark(i):"?")+'</div><b>'+(u?name:(secret?"？？？":d[0]))+'</b><small>'+desc+'</small>'+(u?'<em>'+(save.selectedTitle===name?"つけている":"タッチしてつける")+'</em>':'')+'</button>';
}
function secretTitleName(i){return {40:"なぞのかけら研究家",41:"ひみつのかけら博士",42:"カードゲームの達人",43:"音と空のぼうけんしゃ",44:"モンスター王",45:"なかまのリーダー",46:"花と森の島",47:"75回の大ぼうけん",48:"八つの道の達人",49:"ABCワールドの守り人"}[i]||"ひみつのぼうけんしゃ"}
function titleMark(i){if(i>=40)return "?";return i<6?["A","5","10","25","50","100"][i]:i<12?"★":i<17?"B":i<23?"W":"ABC"}
function selectTitle(i){let d=titleDefs[i];if(!titleUnlocked(d))return;save.selectedTitle=d[3]?secretTitleName(i):d[0];persist();openTitles()}
function refreshDailyForToday(){let k=dayKey();if(!save.daily||save.daily.day!==k){save.daily={day:k,startPlays:save.plays||0,startStars:save.totalStarsEarned||save.stars||0,startCoins:save.totalCoinsEarned||save.coins||0,claimed:[false,false,false]};try{localStorage.setItem("abcAdventureSave",JSON.stringify(save))}catch(e){}}}
function dayKey(){let d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function ensureDaily(){
 let k=dayKey();if(!save.daily||save.daily.day!==k){save.daily={day:k,startPlays:save.plays||0,startStars:save.totalStarsEarned||save.stars||0,startCoins:save.totalCoinsEarned||save.coins||0,claimed:[false,false,false]};persist()}
}
function dailyData(){
 ensureDaily();return [
 ["ABCゲームで 1回遊ぼう",Math.min(1,Math.max(0,(save.plays||0)-save.daily.startPlays)),1,3,"star"],
 ["ABCゲームで 3回遊ぼう",Math.min(3,Math.max(0,(save.plays||0)-save.daily.startPlays)),3,8,"coin"],
 ["スターを 5こ集めよう",Math.min(5,Math.max(0,(save.totalStarsEarned||0)-save.daily.startStars)),5,4,"egg"]
 ]}
function openDaily(){dailyClaimBusy=false;enterGameScreen("きょうのミッション");
 ensureDaily();
 let ds=dailyData();
 gameBody.innerHTML='<div class="daily-banner"><b>きょうの3つのミッション</b><span>できる日だけでOK。れんぞくログインはありません。</span></div><div class="daily-list">'+ds.map((d,i)=>'<div class="daily-card '+(d[1]>=d[2]?'daily-done':'')+'"><div class="daily-number">'+(i+1)+'</div><div><b>'+d[0]+'</b><div class="daily-meter"><i style="width:'+(d[1]/d[2]*100)+'%"></i></div><small>'+d[1]+' / '+d[2]+'　ごほうび：'+(d[4]==="star"?"スター "+d[3]+"こ":d[4]==="coin"?"コイン "+d[3]+"まい":"たまごパワー +"+d[3])+'</small></div><button onclick="claimDaily('+i+')" '+(d[1]<d[2]||save.daily.claimed[i]?'disabled':'')+'>'+(save.daily.claimed[i]?"うけとりずみ":"うけとる")+'</button></div>').join("")+'</div><div class="daily-note">休んだ日があっても不利にならないよ。次に来た日に、新しいミッションにちょうせんしよう！</div>';
 render();
}
let dailyClaimBusy=false;
function claimDaily(i){if(dailyClaimBusy)return;dailyClaimBusy=true;
 let d=dailyData()[i];if(!d||d[1]<d[2]||save.daily.claimed[i]){dailyClaimBusy=false;return;}
 if(d[4]==="star"){earn(d[3],0)}else if(d[4]==="coin"){earn(0,d[3])}else{if((save.buddies||[]).length>=buddies.length){ensureRewardSave();save.rewardItems.sparkle=(save.rewardItems.sparkle||0)+d[3]}else save.eggProgress=Math.min(20,(save.eggProgress||0)+d[3]);}
 save.daily.claimed[i]=true;persist();dailyClaimBusy=false;openDaily();
}
function ensureSettings(){if(!save.settings)save.settings={sound:true,motion:true}}
function openSettings(){enterGameScreen("せってい");
 ensureSettings();
 gameBody.innerHTML='<div class="settings-page"><div class="settings-group"><h3>おんせい</h3><div class="setting-row"><div><b>アルファベットの音</b><small>ゲームで A・B・C などの音を聞きます。</small></div><div class="setting-actions"><button class="sound-test" onclick="save.settings.sound?sayLetter(\'A\'):showToast(\'アルファベットの音をONにしてね\')">Aを聞く</button><button class="toggle '+(save.settings.sound?'on':'')+'" onclick="toggleSetting(\'sound\')">'+(save.settings.sound?'ON':'OFF')+'</button></div></div></div><div class="settings-group"><h3>うごき</h3><div class="setting-row"><div><b>アニメーション</b><small>ロケットや列車などの動きを表示します。</small></div><button class="toggle '+(save.settings.motion?'on':'')+'" onclick="toggleSetting(\'motion\')">'+(save.settings.motion?'ON':'OFF')+'</button></div></div><div class="settings-group"><h3>データ</h3><div class="setting-row"><div><b>このiPadに自動で保存</b><small>スター・コイン・なかま・島などは、このiPadのブラウザに自動保存されます。</small></div><span class="saved-badge">自動保存</span></div></div><div class="settings-group"><h3>もし画面の動きがおかしいとき</h3><div class="setting-row"><div><b>ホームへ安全にもどる</b><small>記録は消えません。</small></div><button onclick="goHome()">ホームへ</button></div></div><div class="settings-group teacher-note"><h3>先生へ</h3><p>Build: <span id="buildLabel"></span><br><b>授業用データ保存：ON</b><br>動作チェック：<span id="healthLabel">確認中</span><br>指定英字フォント：<span id="fontLabel">確認中</span></p><p>児童の通常画面から、セーブデータを消すボタンは置いていません。誤操作でこれまでの記録が消えないためです。</p><button onclick="runTeacherCheck()">端末チェック</button> <button onclick="openAlphabetSoundCheck()">A〜Z 音声チェック</button> <button onclick="copySaveForTeacher()">記録データをコピー</button> <button onclick="restoreSaveForTeacher()">記録データを復元</button></div></div>';
 let bl=document.getElementById("buildLabel");if(bl)bl.textContent=APP_BUILD;let hl=document.getElementById("healthLabel");if(hl){let h=appHealthCheck();hl.textContent=(h.fnOK&&h.navOK&&h.gameOK)?"OK":"要確認";}let fl=document.getElementById("fontLabel");if(fl)fl.textContent=approvedFontReady()?"NHHandwriting":"端末未読込";
 render();
}
async function copySaveForTeacher(){try{let t=JSON.stringify({...save,_export:{build:APP_BUILD,at:new Date().toISOString()}});if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);showToast("記録データをコピーしました")}else showToast("この環境ではコピーできません")}catch(e){showToast("コピーできませんでした")}}
function openAlphabetSoundCheck(){
 enterGameScreen("A〜Z 音声チェック");
 gameBody.innerHTML='<button class="back utility-back" onclick="openSettings()">← せってい</button><div class="finish-box"><h2>文字をタッチして音を確認</h2><p>かるたと同じ音声です。</p><div class="sound-check-grid">'+ABC.map(x=>'<button class="sound-test" onclick="sayLetter(\''+x+'\')">'+x+'</button>').join("")+'</div></div>';
 normalizeButtons();
}
function runTeacherCheck(){
 let storage=false;try{let k="abc_test_"+Date.now();localStorage.setItem(k,"1");storage=localStorage.getItem(k)==="1";localStorage.removeItem(k)}catch(e){}
 let speech=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
 let h=appHealthCheck(),font=approvedFontReady();
 let msg="端末チェック\n\nゲーム構成："+(h.fnOK&&h.navOK&&h.gameOK?"OK":"要確認")+"\n自動保存："+(storage?"OK":"要確認")+"\n音声機能："+(speech?"OK":"要確認")+"\n指定英字フォント："+(font?"読込済み":"端末未読込")+"\n\nBuild: "+APP_BUILD;
 alert(msg);
 if(speech&&save.settings?.sound)setTimeout(()=>sayLetter("A"),120);
}
async function restoreSaveForTeacher(){
 let raw=prompt("以前コピーした記録データを貼り付けてください。\n※今の記録と入れかわります。");
 if(!raw)return;
 try{
  let parsed=JSON.parse(raw);
  if(!parsed||typeof parsed!=="object"||Array.isArray(parsed))throw new Error("bad");if(parsed.stars!=null&&!Number.isFinite(Number(parsed.stars)))throw new Error("bad");if(parsed.coins!=null&&!Number.isFinite(Number(parsed.coins)))throw new Error("bad");if(parsed.worldLv!=null&&!Number.isFinite(Number(parsed.worldLv)))throw new Error("bad");
  if(!confirm("この記録データに入れかえますか？"))return;
  delete parsed._export;save=parsed;migrateSave();normalizeGuideState();selfCheck();syncWorldLevel();ensureEconomy();syncEarnedTitles();persist();goHome();setTimeout(()=>showToast("記録データを復元しました"),80);
 }catch(e){showToast("記録データを読み取れませんでした")}
}
function toggleSetting(k){ensureSettings();save.settings[k]=!save.settings[k];persist();if(k==="sound"&&save.settings.sound&&"speechSynthesis" in window){setTimeout(()=>sayLetter("A"),80)}openSettings()}
function showNotice(x){alert(x+"は、ゲームの進みとつながる長期コレクション機能として実装します。")}
function offerRecovery(){try{showToast("うまく動かないときは、ホームにもどってもう一度ためしてね")}catch(e){}}
window.addEventListener("error",offerRecovery);
document.addEventListener("contextmenu",e=>{if(e.target.closest("button"))e.preventDefault()});
window.addEventListener("offline",()=>showToast("インターネットにつながっていません"));
window.addEventListener("online",()=>showToast("インターネットにつながりました"));
migrateSave();normalizeGuideState();selfCheck();syncWorldLevel();ensureEconomy();syncEarnedTitles();persist();if(!verifyMasterContract())console.warn("Master navigation contract mismatch");render();normalizeButtons();initApprovedMasterHome();setTimeout(()=>openFirstGuide(),120);
let hiddenDuringPlay=false,hiddenAt=0;window.addEventListener("beforeunload",()=>{try{localStorage.setItem("abcAdventureSave",JSON.stringify(save))}catch(e){}});
window.addEventListener("pagehide",()=>{try{localStorage.setItem("abcAdventureSave",JSON.stringify(save))}catch(e){}});
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenDuringPlay=game.classList.contains("active");hiddenAt=Date.now();if("speechSynthesis" in window)try{speechSynthesis.cancel()}catch(e){};newSession()}else{let away=Date.now()-hiddenAt;if(hiddenDuringPlay&&away>1200){game.classList.remove("active");home.classList.remove("hidden");showToast("ホームにもどりました")}hiddenDuringPlay=false;render()}});
